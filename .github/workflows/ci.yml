name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -c constraints.txt uv
      - run: uv --config-file uv.toml sync --locked --python '${{ matrix.python }}'
      - run: uv --config-file uv.toml run --locked --python '${{ matrix.python }}' python -m unittest discover -s tests -v

[project]
name = "scummhd"
version = "0.1.0"
description = "Build provenance-preserving frame datasets from ScummWEB adventures."
requires-python = ">=3.11"
dependencies = ["pillow>=11,<13"]

[project.optional-dependencies]
huggingface = ["datasets>=4,<6"]

[tool.uv]
package = false
exclude-newer = "7 days"
constraint-dependencies = ["mistralai!=2.4.6", "guardrails-ai!=0.10.1"]
